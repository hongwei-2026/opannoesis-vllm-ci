name: vllm-gate

# 仅手动 / 机器人命令触发，不定时跑
on:
  workflow_dispatch:
    inputs:
      ref:
        description: GitCode branch/tag/commit
        required: false
        default: main
      issue_number:
        description: GitCode issue number to post run link
        required: false
        default: ""

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Post start link to GitCode
        if: github.event.inputs.issue_number != ''
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
          ISSUE: ${{ github.event.inputs.issue_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REF: ${{ github.event.inputs.ref || 'main' }}
        run: |
          set -euo pipefail
          BODY="CI 已开始跑（ref=\`${REF}\`）。
          实时日志：${RUN_URL}"
          curl -fsS -X POST \
            -H "Authorization: Bearer ${GITCODE_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://api.gitcode.com/api/v5/repos/OpenNoesis/vllm/issues/${ISSUE}/comments" \
            -d "$(python -c 'import json,os; print(json.dumps({"body": os.environ["BODY"]}))')"

      - name: Shallow clone GitCode OpenNoesis/vllm
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
          REF: ${{ github.event.inputs.ref || 'main' }}
        run: |
          set -euo pipefail
          if [ -z "${GITCODE_TOKEN:-}" ]; then
            echo "GITCODE_TOKEN secret missing"
            exit 1
          fi
          if ! git clone --depth 1 --branch "$REF" \
            "https://oauth2:${GITCODE_TOKEN}@gitcode.com/OpenNoesis/vllm.git" src; then
            git clone --depth 1 \
              "https://oauth2:${GITCODE_TOKEN}@gitcode.com/OpenNoesis/vllm.git" src
            git -C src checkout "$REF"
          fi
          echo "HEAD=$(git -C src rev-parse --short HEAD)"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile gate
        working-directory: src
        run: |
          set -euo pipefail
          python - <<'PY'
          import compileall, pathlib, sys
          candidates = [
              pathlib.Path("vllm/model_executor/models"),
              pathlib.Path("vllm/entrypoints"),
              pathlib.Path("vllm/config"),
              pathlib.Path("vllm"),
          ]
          roots = [p for p in candidates if p.exists()]
          preferred = [p for p in roots if str(p) != "vllm"]
          roots = preferred or roots
          if not roots:
              print("no vllm paths found", file=sys.stderr)
              sys.exit(1)
          ok = True
          for r in roots:
              print(f"compileall {r}")
              if not compileall.compile_dir(str(r), quiet=1):
                  ok = False
          sys.exit(0 if ok else 1)
          PY

      - name: Post result link to GitCode
        if: always() && github.event.inputs.issue_number != ''
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
          ISSUE: ${{ github.event.inputs.issue_number }}
          CONCLUSION: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          BODY="CI 结束：**${CONCLUSION}**
          日志：${RUN_URL}"
          curl -fsS -X POST \
            -H "Authorization: Bearer ${GITCODE_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://api.gitcode.com/api/v5/repos/OpenNoesis/vllm/issues/${ISSUE}/comments" \
            -d "$(python -c 'import json,os; print(json.dumps({"body": os.environ["BODY"]}))')"
